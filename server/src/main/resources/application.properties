spring.application.name=linkops-lite
server.port=8090
# 本地从 .env.local 读取 DATABASE_URL(Neon 原样连接串)
# 兼容两种工作目录:在 server/ 下运行,或在 IDEA 中以 linkops-lite 为根运行
spring.config.import=optional:file:.env.local[.properties],optional:file:server/.env.local[.properties]
# 开发期用直连(去掉 -pooler),Flyway 迁移需要会话级锁
app.db.use-direct=true
spring.datasource.hikari.maximum-pool-size=5

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=dev.linkops.server.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 对话与 Embedding 独立配置(地址、key、模型),以后可分别更换厂商
# Spring AI 2.0 底层用 OpenAI 官方 Java SDK,BASE_URL 填到 /v1 为止
spring.ai.openai.chat.base-url=${AI_CHAT_BASE_URL:}
spring.ai.openai.chat.api-key=${AI_CHAT_API_KEY:}
spring.ai.openai.chat.model=${AI_CHAT_MODEL:qwen3.8-flash}
spring.ai.openai.embedding.base-url=${AI_EMBEDDING_BASE_URL:}
spring.ai.openai.embedding.api-key=${AI_EMBEDDING_API_KEY:}
spring.ai.openai.embedding.model=${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
spring.ai.openai.embedding.dimensions=${AI_EMBEDDING_DIMENSIONS:1024}

# 只启用对话和文本 Embedding;语音、图片、审核模型用不到,关闭以免要求额外的 key
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# 研判:格式或业务校验不通过时的最多尝试次数(含第一次)
app.judge.max-attempts=3
